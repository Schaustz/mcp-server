services:
  - type: web
    name: mcp-campaign-commander
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python servidor_mcp.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GEMINI_API_KEY
        sync: false
      - key: CODIGO_ACESSO
        sync: false
